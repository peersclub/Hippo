# Local infra + full-stack compose (run from the REPO ROOT):
#
#   docker compose -f deploy/docker-compose.yml up -d          # postgres + redis + migrations
#   docker compose -f deploy/docker-compose.yml --profile services up -d   # + all 8 services
#
# The default profile is INFRA ONLY — postgres, redis, and a one-shot
# migration runner — because that's what local `pnpm dev` needs to exercise
# durable stores (the services themselves run faster un-containerized under
# turbo). The `services` profile builds every deploy/docker/*.Dockerfile for
# a full container parity run, e.g. the cross-process rotate/suspend check
# (scripts/rotate-suspend-e2e.sh).
#
# Ports mirror production (deploy/README.md). Secrets here are LOCAL-ONLY
# defaults — never reuse them anywhere real.

name: hippo

x-service-env: &service-env
  DATABASE_URL: postgres://hippo:hippo-local@postgres:5432/hippo
  REDIS_URL: redis://redis:6379
  INTERNAL_API_TOKEN: local-internal-token
  NODE_ENV: development

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: hippo
      POSTGRES_PASSWORD: hippo-local
      POSTGRES_DB: hippo
    ports: ['5432:5432']
    volumes: ['pgdata:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U hippo']
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports: ['6379:6379']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 3s
      timeout: 3s
      retries: 20

  # One-shot: applies packages/stores/migrations in order, then exits.
  # Re-run any time — the runner skips applied rows (schema_migrations).
  migrate:
    image: node:22-alpine
    working_dir: /repo
    volumes: ['..:/repo']
    environment:
      DATABASE_URL: postgres://hippo:hippo-local@postgres:5432/hippo
    entrypoint:
      ['sh', '-c', 'corepack enable && pnpm install --frozen-lockfile && pnpm --filter @hippo/stores migrate']
    depends_on:
      postgres: { condition: service_healthy }

  # ── full-stack profile ─────────────────────────────────────────────────
  gateway:
    profiles: [services]
    build: { context: .., dockerfile: deploy/docker/gateway.Dockerfile }
    environment:
      <<: *service-env
      PORT: '8788'
      INTELLIGENCE_URL: http://intelligence:8791
      MEMORY_URL: http://memory:8792
      SEAM_URL: http://seam:8793
    ports: ['8788:8788']
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  admin:
    profiles: [services]
    build: { context: .., dockerfile: deploy/docker/admin.Dockerfile }
    environment:
      <<: *service-env
      PORT: '8794'
      ADMIN_JWT_SECRET: local-admin-jwt-secret
      GATEWAY_URL: http://gateway:8788
      INTELLIGENCE_URL: http://intelligence:8791
      # Memory proxies (personas, learned facts, memory-config) — without
      # this the service warns at boot and aims at localhost, which is empty
      # inside a container.
      MEMORY_URL: http://memory:8792
      # First-boot owner operator (created only while the table is empty).
      # LOCAL-ONLY credentials — never reuse them anywhere real.
      ADMIN_BOOTSTRAP_EMAIL: ops@hippo.local
      ADMIN_BOOTSTRAP_PASSWORD: local-admin-password
      # TRUST_PROXY stays unset here: nothing proxies compose traffic, and
      # honoring x-forwarded-for without a proxy lets clients forge their IP.
      # Set TRUST_PROXY=1 on real deploys behind Railway/Vercel.
    ports: ['8794:8794']
    depends_on:
      postgres: { condition: service_healthy }

  portal:
    profiles: [services]
    build: { context: .., dockerfile: deploy/docker/portal.Dockerfile }
    environment:
      <<: *service-env
      PORT: '8795'
      PORTAL_JWT_SECRET: local-portal-jwt-secret
    ports: ['8795:8795']
    depends_on:
      postgres: { condition: service_healthy }

  seam:
    profiles: [services]
    build: { context: .., dockerfile: deploy/docker/seam.Dockerfile }
    environment:
      <<: *service-env
      PORT: '8793'
      VENUE: sim
      MARKET_DATA_URL: http://market-data:8790
      GATEWAY_URL: http://gateway:8788
    ports: ['8793:8793']
    depends_on:
      postgres: { condition: service_healthy }

  memory:
    profiles: [services]
    build: { context: .., dockerfile: deploy/docker/memory.Dockerfile }
    environment:
      <<: *service-env
      PORT: '8792'
    ports: ['8792:8792']
    depends_on:
      postgres: { condition: service_healthy }

  market-data:
    profiles: [services]
    build: { context: .., dockerfile: deploy/docker/market-data.Dockerfile }
    environment:
      PORT: '8790'
    ports: ['8790:8790']

  intelligence:
    profiles: [services]
    build: { context: .., dockerfile: deploy/docker/intelligence.Dockerfile }
    environment:
      PORT: '8791'
      MARKET_DATA_URL: http://market-data:8790
      # No LLM_API_KEY by default — boots in honest mock mode.
    ports: ['8791:8791']

  host-venue:
    profiles: [services]
    build: { context: .., dockerfile: deploy/docker/host-venue.Dockerfile }
    environment:
      <<: *service-env
      PORT: '8796'
      INTELLIGENCE_URL: http://intelligence:8791
      # Forced-degraded proxy target (host settings → gateway /internal/degraded).
      GATEWAY_URL: http://gateway:8788
    ports: ['8796:8796']
    depends_on:
      postgres: { condition: service_healthy }

volumes:
  pgdata:
